name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install ruff
        # pinned: an unpinned install silently changes what CI enforces whenever
        # ruff ships new defaults (0.15 -> 0.16 added 127 findings here)
        run: pip install ruff==0.16.0
      - name: Ruff check
        run: ruff check .
      - name: Syntax check
        run: python -m compileall -q probe_eddy_ng.py ldc1612_ng.py install.py
